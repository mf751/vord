<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        background: #000;
        color: #ddd;
        font-family:
          Roboto Mono,
          monospace;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .title-box {
        margin-bottom: 20px;
      }

      .title,
      .description {
        text-align: center;
        margin: 0;
        padding: 0;
      }

      .title {
        margin-bottom: 8px;
      }

      .version {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 0;
        margin: 0;
        height: 32px;
        font-size: 14px;
        border-top: solid 1px white;
        border-bottom: solid 1px white;
      }

      .vim {
        color: #2c79f5;
      }

      .help-menu {
        display: flex;
        flex-direction:;
        gap: 24px;
        padding: 8px 0;
        font-weight: 420;
      }
      .help-menu > div {
        display: flex;
        flex-direction: column;
        font-size: 14px;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="title-box">
        <h1 class="title"><span class="vim">V</span>ord</h1>
        <h3 class="description">Web Browser <span class="vim">Vim</span></h3>
      </div>
      <h4 class="version">Version <span class="vim">1.0</span></h4>
      <div class="help-menu">
        <div class="type">
          <div class="vim"><span>Type </span></div>
          <div class="vim"><span>Type </span></div>
          <div class="vim"><span>Type </span></div>
        </div>
        <div class="keyword">
          <div>:help</div>
          <div>:q</div>
          <div>:darkmode</div>
        </div>
        <div class="command-description">
          <div>show help menu</div>
          <div>quit vord</div>
          <div>toggle dark mode</div>
        </div>
      </div>
    </div>
  </body>
</html>
